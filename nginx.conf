# =============================================================================
# Configuration nginx pour servir le SPA React (build Vite) sur Koyeb
# =============================================================================
server {
    # Port d'écoute — DOIT correspondre à EXPOSE (Dockerfile) et au port Koyeb
    listen 8080;
    server_name _;

    # Dossier où le Dockerfile copie le build Vite
    root   /usr/share/nginx/html;
    index  index.html;

    # -------------------------------------------------------------------------
    # ROUTING SPA (CRITIQUE)
    # React Router gère les routes côté client. Sans cette règle, un refresh
    # (F5) ou un accès direct à une URL type /mes-listes renverrait un 404 nginx
    # car aucun fichier physique ne correspond.
    # try_files : on cherche le fichier demandé, sinon on retombe sur index.html
    # et c'est React Router qui résout la route.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -------------------------------------------------------------------------
    # Cache long pour les assets versionnés par Vite (hash dans le nom de fichier)
    # -------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html ne doit JAMAIS être mis en cache (sinon l'app reste figée
    # sur un ancien build après un déploiement)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Compression gzip (allège le transfert des JS/CSS)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;
}
